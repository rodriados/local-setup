---
# Personal workspace setup automation.
# @file The DisplayLink drivers installation role tasks.
# @author Rodrigo Siqueira <me@rodriados.com>
# @copyright 2026-present Rodrigo Siqueira

- name: Install DisplayLink Drivers on Ubuntu
  when:
    - ansible_facts.system == "Linux"
    - ansible_facts.distribution == "Ubuntu"
  ignore_errors: true
  tags: displaylink
  block:
    - name: Gather Ubuntu Package Facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Install DisplayLink Drivers when not Yet Installed
      when: "'displaylink-driver' not in ansible_facts.packages"
      become: true
      block:
        - name: Install DisplayLink Dependencies
          ansible.builtin.package:
            name: "{{ item }}"
            state: present
            update_cache: true
          loop:
            - "{{ displaylink_dependencies | default([]) }}"

        - name: Install DisplayLink APT Repository Package
          ansible.builtin.apt:
            deb: "{{ displaylink_apt_repository_url }}"
            state: present

        - name: Install DisplayLink Drivers
          ansible.builtin.apt:
            name: displaylink-driver
            state: present
            update_cache: true
