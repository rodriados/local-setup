---
# Personal workspace setup automation.
# @file The Distrobox installation role tasks.
# @author Rodrigo Siqueira <me@rodriados.com>
# @copyright 2026-present Rodrigo Siqueira

- name: Install Distrobox
  ansible.builtin.package:
    name:
      - distrobox
      - flatpak
    state: present

- name: Enable Docker Registry for Distrobox
  ansible.builtin.lineinfile:
    line: 'unqualified-search-registries = ["docker.io"]'
    path: "{{ distrobox_container_registry_config_file }}"
    state: present
    create: true
  become: true

- name: Create Distrobox User Configuration Folders
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ distrobox_user_config_file }}"
    - "{{ distrobox_user_init_hook }}"

- name: Copy Distrobox User Init Hook Script
  ansible.builtin.copy:
    src: init-hook.sh
    dest: "{{ distrobox_user_init_hook }}"
    mode: '0755'

- name: Create Distrobox Configuration File
  ansible.builtin.template:
    src: distrobox.conf.j2
    dest: "{{ distrobox_user_config_file }}"
    mode: '0644'
  vars:
    distrobox_container_image_default: >
      {{ distrobox_default_image | default('ubuntu:latest') }}
