---
# Personal workspace setup automation.
# @file The Google Chrome installation role tasks.
# @author Rodrigo Siqueira <me@rodriados.com>
# @copyright 2026-present Rodrigo Siqueira

- name: Install Google Chrome on Linux
  when: ansible_facts.system == "Linux"
  become: true
  block:
    - name: Add Google Chrome APT Repository
      ansible.builtin.deb822_repository:
        name: google-chrome
        types: deb
        suites: stable
        components: main
        uris: "{{ google_chrome_apt_repository_url }}"
        signed_by: "{{ google_chrome_signing_key_url }}"
        state: present
      when: ansible_facts.os_family == "Debian"

    - name: Add Google Chrome YUM/DNF Repository
      ansible.builtin.yum_repository:
        name: google-chrome
        description: Google Chrome
        baseurl: "{{ google_chrome_rpm_repository_url }}"
        gpgkey: "{{ google_chrome_signing_key_url }}"
        gpgcheck: true
        enabled: true
      when: ansible_facts.os_family == "RedHat"

    - name: Install Google Chrome stable
      ansible.builtin.package:
        name: google-chrome-stable
        state: present

- name: Install Google Chrome on MacOS
  when: ansible_facts.system == "Darwin"
  community.general.homebrew_cask:
    name: google-chrome
    state: present
