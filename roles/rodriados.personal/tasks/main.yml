---
# Personal workspace setup automation.
# @file The personal profile main tasks list.
# @author Rodrigo Siqueira <me@rodriados.com>
# @copyright 2026-present Rodrigo Siqueira

- name: Install Drivers
  ansible.builtin.include_tasks:
    file: "driver/{{ item }}.yml"
    apply:
      tags:
        - "{{ item }}"
        - drivers
  loop: "{{ drivers | default([]) | unique }}"
  tags: always

- name: Install Softwares
  ansible.builtin.include_tasks:
    file: "software/{{ item }}.yml"
    apply:
      tags:
        - "{{ item }}"
        - softwares
  loop: "{{ softwares | default([]) | unique }}"
  tags: always

- name: Assemble Toolboxes
  ansible.builtin.include_role:
    name: rodriados.personal/roles/toolbox
    apply:
      tags:
        - "{{ item }}"
        - toolbox
  vars:
    toolbox_assemble_file: >
      {{ lookup('first_found', 'toolbox/' ~ item ~ '.yml') }}
  loop: "{{ toolboxes | default([]) | unique }}"
  tags: always
