---
# Personal workspace setup automation.
# @file The personal profile main tasks list.
# @author Rodrigo Siqueira <me@rodriados.com>
# @copyright 2026-present Rodrigo Siqueira

- name: Install Drivers
  ansible.builtin.include_tasks:
    file: "driver/{{ item }}.yml"
  loop: "{{ drivers | default([]) }}"

- name: Install Softwares
  ansible.builtin.include_tasks:
    file: "software/{{ item }}.yml"
  loop: "{{ softwares | default([]) }}"

- name: Install Modules
  ansible.builtin.include_tasks:
    file: "modules.yml"
