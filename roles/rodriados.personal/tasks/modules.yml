---
# Personal workspace setup automation.
# @file The personal profile tasks for installing modules.
# @author Rodrigo Siqueira <me@rodriados.com>
# @copyright 2026-present Rodrigo Siqueira

- name: Prepare and Install Modules
  when: modules | default([]) | length > 0
  block:
    - name: Install Distrobox
      ansible.builtin.package:
        name:
          - distrobox
          - flatpak
        state: present

    - name: Enable Docker Registry for Distrobox
      ansible.builtin.lineinfile:
        line: "{{ container_registry_config_line }}"
        path: "{{ container_registry_config_path }}"
        state: present
        create: true
      vars:
        container_registry_config_line: 'unqualified-search-registries = ["docker.io"]'
        container_registry_config_path: /etc/containers/registries.conf
      become: true

    - name: Create Distrobox Configuration Folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ distrobox.init_hook_path | dirname }}"
        - "{{ distrobox_config_file_path | dirname }}"

    - name: Copy the Module Init Hook Script
      ansible.builtin.copy:
        src: module-init-hook.sh
        dest: "{{ distrobox.init_hook_path }}"
        mode: '0755'

    - name: Set Distrobox Configuration for Modules
      ansible.builtin.template:
        src: distrobox.conf.j2
        dest: "{{ distrobox_config_file_path }}"
        mode: '0644'
      vars:
        module_image_default: "{{ distrobox.image_default | default('ubuntu:latest') }}"
        module_init_hook_path: "{{ distrobox.init_hook_path }}"

    - name: Check Already Installed Modules
      ansible.builtin.command:
        cmd: distrobox list --no-color
      register: installed_module_list
      changed_when: false

    - name: Install Modules
      ansible.builtin.command:
        cmd: >
          distrobox assemble create
            --file {{ role_path }}/files/module/{{ item }}.ini
      environment:
        DBX_NON_INTERACTIVE: "1"
      loop: "{{ modules | default([]) }}"
      when: item not in installed_module_list.stdout

  vars:
    distrobox_config_file_path: ~/.config/distrobox/distrobox.conf
