---
# Personal workspace setup automation.
# @file The tasks for installing Google Chrome.
# @author Rodrigo Siqueira <me@rodriados.com>
# @copyright 2026-present Rodrigo Siqueira

- name: Install Google Chrome
  ansible.builtin.include_role:
    name: rodriados.software/google-chrome
  tags:
    - google-chrome
    - browser

- name: Set Google Chrome as default browser
  ansible.builtin.include_role:
    name: gantsign.default-web-browser
  vars:
    default_web_browser: google-chrome
  tags:
    - google-chrome
    - browser
