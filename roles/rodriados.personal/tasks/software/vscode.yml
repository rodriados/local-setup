---
# Personal workspace setup automation.
# @file The tasks for installing Visual Studio Code.
# @author Rodrigo Siqueira <me@rodriados.com>
# @copyright 2026-present Rodrigo Siqueira

- name: Install Visual Studio Code
  ansible.builtin.include_role:
    name: rodriados.software/vscode
  vars:
    vscode_extensions: "{{ vscode.extensions | default([], true) }}"
    vscode_settings: "{{ vscode.settings | default({}, true) }}"
    vscode_keybindings: "{{ vscode.keybindings | default([], true) }}"
  tags: vscode
