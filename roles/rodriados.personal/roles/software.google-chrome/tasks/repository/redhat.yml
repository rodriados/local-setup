---
# Personal workspace setup automation.
# @file Google Chrome repository setup tasks for RedHat-like Linux.
# @author Rodrigo Siqueira <me@rodriados.com>
# @copyright 2026-present Rodrigo Siqueira

- name: Add Google Chrome RPM repository
  ansible.builtin.yum_repository:
    name: google-chrome
    description: Google Chrome
    baseurl: "{{ google_chrome_rpm_repository_url }}"
    gpgkey: "{{ google_chrome_signing_key_url }}"
    gpgcheck: true
    enabled: true
  become: true
