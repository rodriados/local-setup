---
# Personal workspace setup automation.
# @file The fzf installation tasks list.
# @author Rodrigo Siqueira <me@rodriados.com>
# @copyright 2026-present Rodrigo Siqueira

- name: Install FZF Terminal Tool
  ignore_errors: true
  block:
    - name: Install FZF via Package Manager
      ansible.builtin.package:
        name: fzf
        state: present
      become: "{{ ansible_facts.pkg_mgr != 'homebrew' }}"

    - name: Hook FZF into Bash
      ansible.builtin.lineinfile:
        line: 'eval "$(fzf --bash)"'
        path: "{{ bash_profile_files | file_exist_or_last }}"
        state: present
        create: true
      vars:
        bash_profile_files:
          - "{{ '~/.bash_profile.local' | expanduser }}"
          - "{{ '~/.bash_profile' | expanduser }}"
      when: "'bash' in terminal_target_shell"

    - name: Hook FZF into Zsh
      ansible.builtin.lineinfile:
        line: 'source <(fzf --zsh)'
        path: "{{ zsh_profile_files | file_exist_or_last }}"
        state: present
        create: true
      vars:
        zsh_profile_files:
          - "{{ '~/.zprofile.local' | expanduser }}"
          - "{{ '~/.zprofile' | expanduser }}"
      when: "'zsh' in terminal_target_shell"
